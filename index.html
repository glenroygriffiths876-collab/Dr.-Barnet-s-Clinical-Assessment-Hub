<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Dr. Barnet's Clinical Assessment Hub</title>
<style>

:root{
  --bg:#f4f5ef; --bg2:#eef4ef; --card:rgba(255,255,255,.88); --card-solid:#fff;
  --ink:#14251f; --muted:#68766f; --line:rgba(18,72,58,.12);
  --brand:#0b5a49; --brand-deep:#063b31; --brand2:#138267; --brand3:#1f9b78;
  --accent:#e9f4ee; --accent2:#f2ead8; --gold:#d7aa4a; --gold2:#f2cf7c;
  --good:#167358; --warn:#9d691d; --bad:#a84646;
  --shadow:0 18px 50px rgba(14,62,49,.09); --shadow-lg:0 30px 85px rgba(8,51,40,.16);
  --radius:24px; --radius-sm:16px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:
 radial-gradient(circle at 18% 0%,rgba(215,170,74,.12),transparent 27rem),
 radial-gradient(circle at 92% 12%,rgba(19,130,103,.10),transparent 28rem),
 linear-gradient(180deg,#f7f7f2 0%,#f1f5f1 48%,#eef2ee 100%);color:var(--ink);min-height:100vh}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.22;background-image:radial-gradient(rgba(9,68,54,.16) .7px,transparent .7px);background-size:22px 22px;mask-image:linear-gradient(to bottom,black,transparent 75%)}
button,input,select,textarea{font:inherit} button{cursor:pointer} a{color:inherit}.hidden{display:none!important}
::selection{background:#d6ebdf;color:var(--brand-deep)}

/* APP CHROME */
.app-shell{min-height:100vh;display:grid;grid-template-columns:286px minmax(0,1fr)}
.sidebar{background:
 radial-gradient(circle at 10% -5%,rgba(242,207,124,.20),transparent 18rem),
 radial-gradient(circle at 120% 75%,rgba(42,173,135,.18),transparent 22rem),
 linear-gradient(160deg,#073e33 0%,#095343 52%,#07392f 100%);color:#fff;padding:24px 18px 20px;position:sticky;top:0;height:100vh;overflow:auto;box-shadow:22px 0 55px rgba(6,46,37,.12);z-index:12}
.sidebar:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(110deg,rgba(255,255,255,.05),transparent 35%)}
.brand{display:flex;align-items:center;gap:13px;margin-bottom:22px;position:relative;z-index:1}.logo{width:48px;height:48px;border-radius:17px;background:linear-gradient(145deg,#f7d98e,#c99231);color:#0b4f40;display:grid;place-items:center;font-weight:900;box-shadow:0 12px 28px rgba(0,0,0,.2),inset 0 1px rgba(255,255,255,.6);position:relative;overflow:hidden}
.logo:before{content:"";position:absolute;width:25px;height:25px;border:2px solid rgba(7,71,56,.42);border-radius:50%;transform:translate(-5px,-5px)}.logo:after{content:"";position:absolute;width:17px;height:17px;border:2px solid rgba(7,71,56,.42);border-radius:50%;transform:translate(8px,8px)}
.logo span{position:relative;z-index:1}.brand h1{font-size:16.5px;line-height:1.16;margin:0;letter-spacing:-.02em}.brand small{display:block;color:#bcd8cf;margin-top:4px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:185px}
.demo-badge{display:inline-flex;gap:8px;align-items:center;font-size:10px;font-weight:900;letter-spacing:.06em;background:rgba(247,212,130,.13);color:#f5d98f;border:1px solid rgba(247,212,130,.25);padding:8px 10px;border-radius:999px;margin-bottom:18px;text-transform:uppercase;backdrop-filter:blur(8px)}.demo-badge:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--gold2);box-shadow:0 0 0 0 rgba(242,207,124,.45);animation:pulseDot 2.2s infinite}
.nav{display:grid;gap:5px;position:relative;z-index:1}.nav:before{content:"Workspace";font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:#8fb7aa;font-weight:900;padding:5px 12px 7px}.nav button{border:1px solid transparent;background:transparent;color:#d1e4de;text-align:left;padding:11px 12px;border-radius:14px;display:flex;align-items:center;gap:11px;transition:.22s ease;position:relative;overflow:hidden;font-weight:650}.nav button svg{width:18px;height:18px;opacity:.83;transition:.22s}.nav button:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.07);transform:translateX(3px);color:#fff}.nav button.active{background:linear-gradient(90deg,rgba(244,210,127,.18),rgba(255,255,255,.08));border-color:rgba(244,210,127,.16);color:#fff;box-shadow:inset 3px 0 0 var(--gold2),0 8px 28px rgba(0,0,0,.08)}.nav button.active svg{color:var(--gold2);opacity:1}.nav .spacer{height:8px}
.side-footer{margin-top:24px;padding-top:16px;border-top:1px solid rgba(255,255,255,.11);font-size:12px;color:#bdd1ca;position:relative;z-index:1}.side-user{display:flex;gap:10px;align-items:center;padding:10px;border-radius:15px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);margin-bottom:10px}.side-user .avatar{flex:0 0 auto}.side-user b{font-size:12px;color:#fff}.side-user small{font-size:10px;color:#a9c9bf}
.main{min-width:0}.topbar{height:76px;background:rgba(248,249,245,.78);border-bottom:1px solid rgba(11,90,73,.09);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:9;backdrop-filter:blur(18px);box-shadow:0 8px 28px rgba(20,61,50,.035)}.topbar .title h2{font-size:17px;margin:0;letter-spacing:-.02em}.topbar .title p{margin:4px 0 0;color:var(--muted);font-size:11px}.top-actions{display:flex;gap:9px;align-items:center}.avatar{width:40px;height:40px;border-radius:15px;background:linear-gradient(145deg,#ddefe7,#bfdcce);color:#0a5444;display:grid;place-items:center;font-weight:900;box-shadow:inset 0 0 0 1px rgba(9,74,59,.08)}.content{padding:28px 30px 38px;max-width:1540px;margin:0 auto;animation:pageIn .42s ease both}

/* COMPONENTS */
.grid{display:grid;gap:18px}.grid.cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}.grid.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}.grid.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{background:linear-gradient(145deg,rgba(255,255,255,.95),rgba(252,253,249,.86));border:1px solid rgba(11,90,73,.10);border-radius:var(--radius);box-shadow:var(--shadow);padding:21px;backdrop-filter:blur(16px);position:relative;overflow:hidden;transition:transform .26s ease,box-shadow .26s ease,border-color .26s ease}.card:before{content:"";position:absolute;left:0;top:0;width:100%;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.95),transparent)}.card:hover{transform:translateY(-3px);box-shadow:0 24px 58px rgba(12,67,52,.11);border-color:rgba(11,90,73,.17)}.card h3{margin:0 0 10px;font-size:15px;letter-spacing:-.01em}.card p{color:var(--muted)}
.kpi{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;min-height:128px}.kpi .num{font-size:34px;font-weight:880;letter-spacing:-.05em;color:#0c4639}.kpi .label{font-size:11px;color:var(--muted);margin-top:4px;font-weight:650}.kpi .chip{font-size:9.5px;padding:6px 8px;border-radius:999px;background:#edf7f2;color:var(--brand);font-weight:850;border:1px solid #d7e9df}.kpi-icon{width:38px;height:38px;border-radius:13px;background:linear-gradient(145deg,#edf7f2,#e2efe8);display:grid;place-items:center;color:var(--brand);margin-bottom:12px;box-shadow:inset 0 0 0 1px rgba(11,90,73,.07)}.kpi-icon svg{width:18px;height:18px}.kpi:nth-child(2) .kpi-icon,.kpi:nth-child(4) .kpi-icon{background:linear-gradient(145deg,#fff8e9,#f5ead1);color:#9b6a21}
.section-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:10px 0 14px}.section-head h2{margin:0;font-size:21px;letter-spacing:-.03em}.section-head p{margin:5px 0 0;color:var(--muted);font-size:12px}.section-kicker{font-size:9px;letter-spacing:.15em;text-transform:uppercase;font-weight:900;color:var(--brand2);margin-bottom:6px}.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid rgba(11,90,73,.14);background:rgba(255,255,255,.88);color:var(--ink);padding:10px 14px;border-radius:14px;font-weight:780;box-shadow:0 5px 14px rgba(8,56,44,.045);transition:.2s ease;position:relative;overflow:hidden}.btn:hover{transform:translateY(-2px);box-shadow:0 9px 24px rgba(8,56,44,.10)}.btn:active{transform:translateY(0) scale(.985)}.btn.primary{background:linear-gradient(135deg,#0c654f,#0a4d3f);color:#fff;border-color:#0a5544;box-shadow:0 10px 24px rgba(10,90,71,.18)}.btn.primary:after{content:"";position:absolute;top:-100%;left:-30%;width:35%;height:300%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.20),transparent);transform:rotate(25deg);transition:.65s}.btn.primary:hover:after{left:120%}.btn.soft{background:#ebf5f0;border-color:#d3e6dc;color:var(--brand)}.btn.warn{background:#fff8eb;border-color:#efdcb2;color:#8a5d19}.btn.danger{background:#fff2f2;border-color:#efcece;color:#913b3b}.btn.sm{padding:7px 10px;border-radius:11px;font-size:11px}
.table-wrap{overflow:auto;border:1px solid rgba(11,90,73,.10);border-radius:17px;background:rgba(255,255,255,.75)}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{padding:13px 14px;border-bottom:1px solid rgba(11,90,73,.08);text-align:left;font-size:12px}.table th{background:#f3f7f3;color:#607168;font-size:9.5px;text-transform:uppercase;letter-spacing:.075em}.table tbody tr{transition:.18s}.table tbody tr:hover{background:#f8fbf8}.table tr:last-child td{border-bottom:0}
.status{display:inline-flex;align-items:center;gap:6px;font-size:9.5px;font-weight:900;border-radius:999px;padding:6px 9px;letter-spacing:.01em}.status.good{background:#e9f6ef;color:var(--good)}.status.warn{background:#fff5e3;color:var(--warn)}.status.bad{background:#fff0f0;color:var(--bad)}.status.neutral{background:#edf2ef;color:#596961}.dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.pipeline{display:grid;grid-template-columns:repeat(5,minmax(170px,1fr));gap:11px;overflow:auto;padding:2px 2px 9px}.pipe{min-width:170px;background:linear-gradient(155deg,#fff,#f5f9f5);border:1px solid rgba(11,90,73,.10);border-radius:19px;padding:15px;position:relative;overflow:hidden;transition:.22s;box-shadow:0 8px 24px rgba(16,64,52,.045)}.pipe:after{content:"";position:absolute;left:0;bottom:0;height:3px;width:100%;background:linear-gradient(90deg,var(--brand2),var(--gold));transform:scaleX(.32);transform-origin:left}.pipe:nth-child(2):after{transform:scaleX(.65)}.pipe:nth-child(5):after{transform:scaleX(.88)}.pipe:hover{transform:translateY(-3px)}.pipe b{display:block;font-size:11px;margin-bottom:5px;color:#496259}.pipe .count{font-size:27px;font-weight:900;letter-spacing:-.05em;color:#0b4f40}.pipe small{color:var(--muted);font-size:10px}
.case-layout{display:grid;grid-template-columns:1fr 360px;gap:18px}.tabs{display:flex;gap:6px;overflow:auto;border-bottom:1px solid var(--line);margin-bottom:16px;padding-bottom:8px}.tab{white-space:nowrap;border:0;background:transparent;padding:9px 11px;border-radius:11px;font-weight:760;color:#607068;transition:.18s}.tab:hover{background:#f0f5f1}.tab.active{background:#e5f1eb;color:var(--brand);box-shadow:inset 0 0 0 1px #d3e7dd}
.progress{height:9px;background:#e8eee9;border-radius:999px;overflow:hidden;box-shadow:inset 0 1px 2px rgba(8,61,48,.08)}.progress>span{height:100%;display:block;background:linear-gradient(90deg,#0c7259,#36a37f,#d5a84b);background-size:200% 100%;border-radius:999px;animation:progressGlow 5s linear infinite;transition:width .45s ease}.task{padding:12px 0;border-bottom:1px solid rgba(11,90,73,.08);display:flex;justify-content:space-between;gap:10px;align-items:center}.task:last-child{border-bottom:0}.task strong{font-size:12px}.task small{display:block;color:var(--muted);margin-top:4px;font-size:10.5px}
.timeline{display:grid;gap:0}.timeline .step{display:grid;grid-template-columns:28px 1fr;gap:10px;position:relative;padding-bottom:15px}.timeline .step:before{content:"";position:absolute;left:13px;top:24px;bottom:0;width:2px;background:#dce8e0}.timeline .step:last-child:before{display:none}.bubble{width:26px;height:26px;border-radius:10px;display:grid;place-items:center;font-size:10px;background:#eef3ef;color:#6d7a73}.bubble.done{background:#dff1e7;color:#1d6a4b}.bubble.current{background:#e7f2ed;color:var(--brand);box-shadow:0 0 0 4px rgba(19,130,103,.08)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:10.5px;font-weight:850;color:#4d6158;letter-spacing:.01em}.field input,.field select,.field textarea{width:100%;border:1px solid rgba(11,90,73,.15);border-radius:14px;padding:11px 12px;background:rgba(255,255,255,.92);color:var(--ink);transition:.2s}.field textarea{min-height:100px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{outline:4px solid rgba(20,133,104,.11);border-color:#55a88e;box-shadow:0 5px 18px rgba(8,77,60,.06)}
.note{background:#f1f7f3;border:1px solid #d9e8df;border-left:4px solid var(--brand2);padding:12px 14px;border-radius:14px;color:#4d6258;font-size:11px;line-height:1.55}.warning{background:#fff8eb;border-color:#eddcb9;border-left-color:#c68b2c}.danger-note{background:#fff2f2;border-color:#efcfcf;border-left-color:#ad4b4b}
.quick-chips{display:flex;flex-wrap:wrap;gap:8px}.quick-chips button{border:1px solid #d2e1d9;background:#fff;border-radius:999px;padding:8px 10px;font-size:11px;transition:.18s}.quick-chips button:hover{transform:translateY(-1px);border-color:#9fc9b8}.quick-chips button.active{background:linear-gradient(135deg,#dff1e8,#edf7f2);border-color:#94c7b2;color:#0b5444;font-weight:850;box-shadow:0 6px 16px rgba(11,90,73,.08)}.score-grid{display:grid;grid-template-columns:repeat(6,minmax(100px,1fr));gap:10px}.score-grid input,.score-grid select{width:100%;padding:9px;border:1px solid var(--line);border-radius:11px}
.report-editor{display:grid;grid-template-columns:220px 1fr 290px;gap:14px}.report-outline,.source-panel{background:rgba(248,251,248,.92);border:1px solid var(--line);border-radius:18px;padding:10px;max-height:70vh;overflow:auto;box-shadow:0 10px 28px rgba(9,62,49,.04)}.report-outline button{width:100%;text-align:left;border:0;background:transparent;padding:8px 9px;border-radius:9px;font-size:11px}.report-outline button.active{background:#e7f2ec;font-weight:850;color:var(--brand)}.editor textarea{width:100%;min-height:62vh;border:1px solid var(--line);border-radius:18px;padding:20px;font-family:Georgia,serif;line-height:1.65;box-shadow:0 12px 35px rgba(11,61,49,.05)}.source-panel h4{margin:0 0 10px}.source-item{padding:10px;border:1px solid var(--line);border-radius:11px;background:#fff;margin-bottom:8px;font-size:11px}

/* DASHBOARD HERO */
.dashboard-hero{position:relative;overflow:hidden;border-radius:30px;padding:30px 32px;background:
 radial-gradient(circle at 88% 22%,rgba(242,207,124,.30),transparent 13rem),
 radial-gradient(circle at 70% 120%,rgba(64,188,149,.27),transparent 18rem),
 linear-gradient(135deg,#063f34 0%,#0a5a48 50%,#0b7258 100%);color:#fff;box-shadow:0 26px 68px rgba(5,62,48,.18);margin-bottom:21px;min-height:220px}.dashboard-hero:before{content:"";position:absolute;width:290px;height:290px;border:1px solid rgba(255,255,255,.11);border-radius:50%;right:-55px;top:-95px;animation:slowSpin 16s linear infinite}.dashboard-hero:after{content:"";position:absolute;width:180px;height:180px;border:1px solid rgba(242,207,124,.18);border-radius:50%;right:32px;top:-28px;animation:slowSpin 12s linear infinite reverse}.hero-grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(260px,.55fr);gap:24px;align-items:center;position:relative;z-index:2}.hero-kicker{display:inline-flex;align-items:center;gap:8px;font-size:9px;font-weight:900;letter-spacing:.17em;text-transform:uppercase;color:#f1d693;margin-bottom:12px}.hero-kicker:before{content:"";width:24px;height:1px;background:#efcf7b}.dashboard-hero h1{font-size:clamp(28px,3vw,44px);line-height:1.01;letter-spacing:-.05em;margin:0 0 12px;max-width:720px}.dashboard-hero h1 span{color:#f4d98f}.dashboard-hero p{margin:0;color:#cfe2dc;line-height:1.55;font-size:12px;max-width:680px}.hero-actions{display:flex;gap:9px;margin-top:20px;flex-wrap:wrap}.dashboard-hero .btn.primary{background:linear-gradient(135deg,#f1cf7b,#d7a848);color:#24483e;border-color:#efd17f;box-shadow:0 12px 28px rgba(0,0,0,.13)}.dashboard-hero .btn.hero-ghost{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.15);color:#fff;backdrop-filter:blur(8px)}.hero-orbit{width:180px;height:180px;margin:auto;position:relative;display:grid;place-items:center}.hero-orbit .core{width:92px;height:92px;border-radius:30px;background:linear-gradient(145deg,#f4d786,#c99b3f);display:grid;place-items:center;color:#0b5545;box-shadow:0 18px 46px rgba(0,0,0,.22),0 0 0 10px rgba(255,255,255,.05);animation:float 4.6s ease-in-out infinite}.hero-orbit .core svg{width:44px;height:44px}.orbit-ring{position:absolute;inset:5px;border:1px solid rgba(255,255,255,.19);border-radius:50%;animation:slowSpin 13s linear infinite}.orbit-ring:before,.orbit-ring:after{content:"";position:absolute;width:12px;height:12px;border-radius:50%;background:#f2cf7c;box-shadow:0 0 0 5px rgba(242,207,124,.10)}.orbit-ring:before{top:18px;left:18px}.orbit-ring:after{right:-2px;bottom:52px;background:#72c8aa}.hero-mini{position:absolute;right:0;bottom:4px;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.13);border-radius:15px;padding:9px 11px;backdrop-filter:blur(8px);font-size:9px;color:#d8e7e2;box-shadow:0 10px 22px rgba(0,0,0,.08)}.hero-mini b{display:block;color:#fff;font-size:12px;margin-bottom:2px}

/* LOGIN — resource-hub inspired */
.login{min-height:100vh;display:grid;place-items:center;background:
 radial-gradient(circle at 10% 10%,rgba(217,170,73,.21),transparent 28rem),
 radial-gradient(circle at 92% 84%,rgba(13,118,91,.22),transparent 30rem),
 linear-gradient(135deg,#eef4ee,#f8f6ee 52%,#e7f0eb);padding:26px;position:relative;overflow:hidden}.login:before,.login:after{content:"";position:absolute;border-radius:50%;filter:blur(1px);pointer-events:none}.login:before{width:430px;height:430px;right:-160px;top:-170px;border:1px solid rgba(10,93,73,.15);box-shadow:0 0 0 38px rgba(10,93,73,.025),0 0 0 86px rgba(10,93,73,.018);animation:slowSpin 22s linear infinite}.login:after{width:300px;height:300px;left:-130px;bottom:-130px;border:1px solid rgba(215,170,74,.18);box-shadow:0 0 0 34px rgba(215,170,74,.03);animation:slowSpin 18s linear infinite reverse}.login-card{width:min(1120px,100%);display:grid;grid-template-columns:1.08fr .92fr;background:rgba(255,255,255,.80);border:1px solid rgba(255,255,255,.8);border-radius:34px;overflow:hidden;box-shadow:0 38px 100px rgba(10,63,50,.19);backdrop-filter:blur(24px);position:relative;z-index:2;animation:loginRise .6s cubic-bezier(.2,.8,.2,1) both}.login-hero{background:
 radial-gradient(circle at 85% 10%,rgba(242,207,124,.25),transparent 15rem),

function createCase(){

 openModal(`<h3>Create assessment case</h3><p>Nothing is prefilled. You may create the Case ID first and let the parent provide most background information.</p><div class="form-grid"><div class="field"><label>Assessment type</label><input id="newType" placeholder="Example: Comprehensive psychological assessment"></div><div class="field"><label>Assessment date</label><input id="newDate" type="date"></div></div><div class="field" style="margin-top:10px"><label>Initial referral note (optional)</label><textarea id="newReferral" placeholder="Example: Referred for reassessment of developmental, adaptive, educational and behavioural functioning."></textarea></div><button class="btn primary" style="margin-top:14px" onclick="saveNewCase()">Create case</button>`);

function saveNewCase(){

: Followed simple instructions but required redirection.'],['perception','Perceptual disturbances','Example: No evidence of perceptual disturbance observed.'],['orientation','Orientation','Example: Oriented to person and familiar setting.'],['judgement','Judgement','Example: Understanding of some social conventions appeared below age expectation.'],['insight','Insight','Example: Limited awareness of areas of difficulty.']].map(x=>`<div class="field" style="margin-top:9px"><label>${x[1]}</label><textarea data-mse="${x[0]}" placeholder="${x[2]}">${esc(m[x[0]]||'')}</textarea></div>`).join('')}<button class="btn primary" style="margin-top:12px" onclick="saveMSE('${c.id}')">Save MSE</button></div></div>`;
}
function addObsChip(x){const t=$('obsText');t.value+=(t.value?' ':'')+x+'.'}
function saveObservation(id){const text=$('obsText').value.trim();if(!text)return toast('Enter an observation.');const db=getDB(),c=db.cases.find(x=>x.id===id);c.observations.push({type:$('obsType').value,text,at:new Date().toLocaleString()});saveDB(db);audit('Saved clinical observation',id);openCase(id,'clinical');toast('Observation saved.')}

function caseResults(c){
 $('caseTab').innerHTML=`<div class="grid cols-2"><div class="card"><h3>Assessment procedures</h3><p style="color:var(--muted)">Record only measures actually administered. Proprietary items and scoring keys are not stored here.</p><div class="form-grid"><div class="field"><label>Instrument / procedure</label><select id="procName"><option value="">Select</option>${['DAS-II','Vineland-3','ASRS','GARS-3','BASC-3','Child Sensory Profile 2','Wesby Developmental Play Scale','Structured / unstructured clinical interview','Behavioural observation'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>Date</label><input id="procDate" type="date"></div></div><div class="field" style="margin-top:9px"><label>Custom / additional procedure</label><input id="procCustom" placeholder="Example: Record review or school-readiness task"></div><div class="field" style="margin-top:9px"><label>Administration / respondent notes</label><textarea id="procNotes" placeholder="Example: Parent form completed remotely; direct testing administered individually in clinic."></textarea></div><button class="btn primary" onclick="saveProcedure('${c.id}')">Add procedure</button>${c.procedures.map((p,i)=>`<div class="task"><div><strong>${esc(p.name)}</strong><small>${esc(p.date||'Date not entered')} · ${esc(p.notes||'')}</small></div><button class="btn sm" onclick="removeProcedure('${c.id}',${i})">Remove</button></div>`).join('')}</div><div class="card"><h3>Verified score / result entry</h3><div class="form-grid"><div class="field"><label>Instrument</label><input id="rInstrument" placeholder="Example: Vineland-3"></div><div class="field"><label>Domain / subscale</label><input id="rDomain" placeholder="Example: Communication"></div><div class="field"><label>Raw score</label><input id="rRaw" placeholder="Example: 51"></div><div class="field"><label>Standard score</label><input id="rStd" placeholder="Example: 74"></div><div class="field"><label>T-score</label><input id="rT" placeholder="Example: 68"></div><div class="field"><label>Percentile</label><input id="rPct" placeholder="Example: 4"></div><div class="field"><label>Confidence interval</label><input id="rCI" placeholder="Example: 70-78"></div><div class="field"><label>Age equivalent</label><input id="rAgeEq" placeholder="Example: 4:1"></div><div class="field"><label>Classification</label><input id="rClass" placeholder="Example: Moderately Low / Elevated"></div></div><div class="field" style="margin-top:9px"><label>Clinician interpretation of this result</label><textarea id="rInterpret" placeholder="Example: Communication skills fell below age expectation, with relative strength in receptive skills compared with expressive communication."></textarea></div><label class="option"><input type="checkbox" id="rVerified"> I verified this result against the authorised scoring source.</label><button class="btn primary" onclick="saveResult('${c.id}')">Add result</button></div></div><div class="card" style="margin-top:16px"><h3>Results table</h3>${c.results.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Instrument</th><th>Domain</th><th>Raw</th><th>Std</th><th>T</th><th>%ile</th><th>CI</th><th>Age Eq.</th><th>Classification</th><th></th></tr></thead><tbody>${c.results.map((r,i)=>`<tr><td>${esc(r.instrument)}</td><td>${esc(r.domain)}</td><td>${esc(r.raw)}</td><td>${esc(r.standard)}</td><td>${esc(r.t)}</td><td>${esc(r.percentile)}</td><td>${esc(r.ci)}</td><td>${esc(r.ageEq)}</td><td>${esc(r.classification)} ${r.verified?'✓':''}</td><td><button class="btn sm" onclick="removeResult('${c.id}',${i})">Remove</button></td></tr>`).join('')}</tbody></table></div>`:empty('No results entered','Add verified results from Q-global or another authorised scoring source.','')}</div><div class="grid cols-2" style="margin-top:16px"><div class="card clinical-locked"><h3>Diagnostic impression</h3><div class="field"><label>Diagnostic code</label><input id="diagCode" value="${esc(c.diagnosis.code||'')}" placeholder="Example: 299.00 / F84.0"></div><div class="field" style="margin-top:8px"><label>Diagnosis / impression</label><input id="diagName" value="${esc(c.diagnosis.name||'')}" placeholder="Example: Autism Spectrum Disorder"></div><div class="field" style="margin-top:8px"><label>Severity / support level / specifier</label><input id="diagSeverity" value="${esc(c.diagnosis.severity||'')}" placeholder="Example: Level 2 - requiring substantial support"></div><div class="field" style="margin-top:8px"><label>Clinical rationale / notes</label><textarea id="diagNotes" placeholder="Describe how developmental history, observations and multiple assessment sources support or do not support the impression.">${esc(c.diagnosis.notes||'')}</textarea></div><label class="option"><input id="diagConfirmed" type="checkbox" ${c.diagnosis.confirmed?'checked':''}> I, the clinician, confirm this diagnostic impression.</label><button class="btn primary" onclick="saveDiagnosis('${c.id}')">Save diagnosis</button></div><div class="card"><h3>Recommendations</h3><div class="recommendation-grid">${RECOMMENDATIONS.map((r,i)=>`<label class="rec-option"><input type="checkbox" data-rec="${i}" ${c.recommendations.includes(i)?'checked':''}><span>${esc(r)}</span></label>`).join('')}</div><div class="field" style="margin-top:10px"><label>Additional individualized recommendations</label><textarea id="customRec" placeholder="Add school-specific, family-specific or therapy-specific recommendations here.">${esc(c.customRecommendations||'')}</textarea></div><button class="btn primary" onclick="saveRecommendations('${c.id}')">Save recommendations</button></div></div>`;
}
function saveProcedure(id){const name=$('procCustom').value.trim()||$('procName').value;if(!name)return toast('Select or enter a procedure.');const db=getDB(),c=db.cases.find(x=>x.id===id);c.procedures.push({name,date:$('procDate').value,notes:$('procNotes').value.trim()});saveDB(db);audit('Added assessment procedure',id);openCase(id,'results')}

function saveResult(id){if(!$('rInstrument').value.trim())return toast('Enter the instrument.');const db=getDB(),c=db.cases.find(x=>x.id===id);c.results.push({instrument:$('rInstrument').value.trim(),domain:$('rDomain').value.trim(),raw:$('rRaw').value.trim(),standard:$('rStd').value.trim(),t:$('rT').value.trim(),percentile:$('rPct').value.trim(),ci:$('rCI').value.trim(),ageEq:$('rAgeEq').value.trim(),classification:$('rClass').value.trim(),interpretation:$('rInterpret').value.trim(),verified:$('rVerified').checked});saveDB(db);audit('Added assessment result',id);openCase(id,'results');toast('Result saved.')}
function removeResult(id,i){const db=getDB(),c=db.cases.find(x=>x.id===id);c.results.splice(i,1);saveDB(db);openCase(id,'results')}
function saveDiagnosis(id){const db=getDB(),c=db.cases.find(x=>x.id===id);c.diagnosis={code:$('diagCode').value.trim(),name:$('diagName').value.trim(),severity:$('diagSeverity').value.trim(),notes:$('diagNotes').value.trim(),confirmed:$('diagConfirmed').checked};saveDB(db);audit('Updated clinician diagnostic impression',id);toast('Diagnostic impression saved.')}
function saveRecommendations(id){const db=getDB(),c=db.cases.find(x=>x.id===id);c.recommendations=[...document.querySelectorAll('[data-rec]:checked')].map(x=>Number(x.dataset.rec));c.customRecommendations=$('customRec').value.trim();saveDB(db);audit('Updated recommendations',id);toast('Recommendations saved.')}
function answer(c,role,id){const a=c.assignments.find(x=>x.role===role);return c.responses[a?.id]?.[id]||''}
function ageFromDob(dob,date){if(!dob)return'';const d=new Date(dob+'T00:00:00'),ref=date?new Date(date+'T00:00:00'):new Date();let y=ref.getFullYear()-d.getFullYear(),m=ref.getMonth()-d.getMonth();if(m<0||(m===0&&ref.getDate()<d.getDate()))y--;return y>=0?`${y} years`:''}
function paragraph(parts){return parts.filter(Boolean).join(' ').replace(/\s+/g,' ').trim()}
function reportDraft(c){
 const child=answer(c,'parent','childName'),dob=answer(c,'parent','dob'),gender=answer(c,'parent','gender'),parents=answer(c,'parent','parents'),school=answer(c,'parent','school'),grade=answer(c,'parent','grade'),age=ageFromDob(dob,c.assessmentDate);
 const p=id=>answer(c,'parent',id),t=id=>answer(c,'teacher',id),s=id=>answer(c,'shadow',id);
 const background=paragraph([p('living')&&`According to parent/guardian report, ${p('living')}`,p('relationships'),p('temperament'),p('interests'),p('strengths')&&`Reported strengths include ${p('strengths')}`]);
 const education=paragraph([p('schoolHistory'),p('schoolStart')&&`Formal schooling reportedly began ${p('schoolStart')}.`,p('academicStrengths'),p('academicConcerns'),p('schoolBehaviour'),t('academic')&&`Teacher report: ${t('academic')}`,t('attention'),t('supports')]);
 const development=paragraph([p('pregnancy'),p('birth'),p('walk')&&`Independent walking was reported at approximately ${p('walk')}.`,p('firstWords')&&`Meaningful single words emerged at approximately ${p('firstWords')}.`,p('phrases')&&`Short phrases/sentences emerged at approximately ${p('phrases')}.`,p('toileting'),p('regression'),p('medical'),p('medications'),p('hearingVision'),p('sleep'),p('eating'),p('mentalHealth'),p('familyHistory')]);
 const services=paragraph([p('services'),p('previousAssessments'),p('previousDiagnosis'),p('helpfulInterventions')]);
 const observations=c.observations.filter(o=>o.type==='Behavioural observation'||o.type==='Clinical interview note').map(o=>o.text).join('\n\n');
 const testingObs=c.observations.filter(o=>o.type==='Testing observation').map(o=>o.text).join('\n\n');
 const mse=Object.entries({'Attitude and General Behaviour':c.mse.appearance,'Mood':c.mse.mood,'Affect':c.mse.affect,'Self-Regulation':c.mse.selfRegulation,'Speech / Stream of Mental Activity':c.mse.speech,'Attention':c.mse.attention,'Concentration':c.mse.concentration,'Perceptual Disturbances':c.mse.perception,'Orientation':c.mse.orientation,'Judgement':c.mse.judgement,'Insight':c.mse.insight}).filter(([,v])=>v).map(([k,v])=>`${k}: ${v}`).join('\n\n');
 const interpretations=c.results.filter(r=>r.verified).map(r=>paragraph([INSTRUMENT_INFO[r.instrument]&&`${r.instrument} is ${INSTRUMENT_INFO[r.instrument].charAt(0).toLowerCase()+INSTRUMENT_INFO[r.instrument].slice(1)}`,`${r.instrument}${r.domain?' - '+r.domain:''}:`,r.standard&&`Standard Score ${r.standard}.`,r.t&&`T-score ${r.t}.`,r.percentile&&`Percentile ${r.percentile}.`,r.ci&&`Confidence interval ${r.ci}.`,r.ageEq&&`Age equivalent ${r.ageEq}.`,r.classification&&`Classification: ${r.classification}.`,r.interpretation])).join('\n\n');
 const diag=c.diagnosis.confirmed?paragraph([c.diagnosis.code,c.diagnosis.name,c.diagnosis.severity,c.diagnosis.notes]):'Clinician confirmation required. No diagnosis is generated automatically by the system.';
 const strengths=paragraph([p('strengths'),t('strengths'),s('strengths')]);
 const recs=c.recommendations.map(i=>RECOMMENDATIONS[i]).concat(c.customRecommendations?[c.customRecommendations]:[]).map((x,i)=>`${i+1}. ${x}`).join('\n');
 return {'Client Information':[['Client Name',child],['Age at Assessment',age],['Gender',gender],['Date of Birth',dob],['Date of Assessment',c.assessmentDate],['Parent(s) / Guardian(s)',parents],['School',school],['Grade',grade]],
 'Identification and Referral':paragraph([child&&`${child} was referred for psychological assessment${c.assessmentType?' ('+c.assessmentType+')':''}.`,c.referral,p('reason'),p('concerns')&&`Primary concerns reported by the parent/guardian include ${p('concerns')}`,p('goals')&&`The family hopes the assessment will clarify ${p('goals')}`])||'Information not yet available.',
 'Background History':background||'Information not yet available.','Educational History':education||'Information not yet available.','Developmental and Health History':development||'Information not yet available.','Services and Previous Evaluations':services||'Information not yet available.',
 'Assessment and Testing Procedures':c.procedures.length?c.procedures.map(x=>paragraph([x.name+(x.date?' - '+x.date:'' )+'.',INSTRUMENT_INFO[x.name]||'',x.notes])).join('\n\n'):'No assessment procedures entered.',

 'Summary and Recommendations':paragraph([child&&`${child} was evaluated to clarify current developmental, adaptive, educational, behavioural and functional needs.`,p('parentPriority')&&`Parent priorities included ${p('parentPriority')}`,recs])||'Clinician summary and individualized recommendations required.','Appendix and Resources':'Add additional classroom supports, parent resources, intervention guidance or supporting material as clinically appropriate.','Signature':getDB().settings.psychologistName||'Clinician signature / credentials'};
}

}${c.report.status==='Finalized'?`<button class="btn primary" onclick="setReportStatus('${c.id}','Released')">Release to Parent</button>`:''}<button class="btn" onclick="downloadReportPDF('${c.id}')">Download PDF</button></div></div>`;

function recordPayment(id,idx){const c=getDB().cases.find(x=>x.id===id),inv=c.invoices[idx],bal=inv.total-inv.paid;openModal(`<h3>Record payment</h3><p>Outstanding balance: <b>${getDB().settings.currency} $${bal.toLocaleString()}</b></p><div class="form-grid"><div class="field"><label>Amount paid</label><input id="payAmt" type="number" min="1" max="${bal}"></div><div class="field"><label>Payment method</label><select id="payMethod"><option>Cash</option><option>Bank transfer</option><option>Card</option><option>Cheque</option><option>Other</option></select></div></div><div class="field" style="margin-top:9px"><label>Reference / note</label><input id="payRef" placeholder="Example: Transfer reference or cheque number"></div><button class="btn primary" style="margin-top:12px" onclick="savePayment('${id}',${idx})">Save payment & create receipt</button>`)}

 $('root').innerHTML=`<div class="portal-header"><div class="portal-header-inner"><div><b>${f.title}</b><div id="saveState" style="font-size:10px;color:#d6e6f7">Answers save automatically.</div></div><button class="btn sm hero-ghost" onclick="renderPortal()">Back</button></div></div><div class="portal-wrap"><div class="mini-progress"><span id="formProgress" style="width:${a.progress}%"></span></div>${body}<div class="sticky-actions"><button class="btn" onclick="renderPortal()">Continue later</button><button class="btn primary" onclick="submitForm('${aid}')">Submit completed form</button></div></div>`;
 document.querySelectorAll('[data-q]').forEach(el=>el.addEventListener('input',()=>scheduleFormSave(aid)));
}
function scheduleFormSave(aid){clearTimeout(saveTimer);$('saveState').textContent='Saving…';saveTimer=setTimeout(()=>saveForm(aid),350)}
function saveForm(aid){const db=getDB(),c=db.cases.find(x=>x.id===db.activePortalCase),a=c.assignments.find(x=>x.id===aid),f=FORMS[a.form],ans={};document.querySelectorAll('[data-q]').forEach(el=>ans[el.dataset.q]=el.value);c.responses[aid]=ans;const qs=f.sections.flatMap(s=>s.questions),done=qs.filter(q=>String(ans[q.id]||'').trim()).length;a.progress=Math.round(done/qs.length*100);a.status=a.progress?'In progress':'Not started';saveDB(db);$('saveState').textContent='Saved';$('formProgress').style.width=a.progress+'%'}
function submitForm(aid){saveForm(aid);const db=getDB(),c=db.cases.find(x=>x.id===db.activePortalCase),a=c.assignments.find(x=>x.id===aid),f=FORMS[a.form],ans=c.responses[aid]||{},missing=f.sections.flatMap(s=>s.questions).filter(q=>q.required&&!String(ans[q.id]||'').trim());if(missing.length)return toast('Please complete the required questions marked with *.');a.status='Submitted';a.progress=100;saveDB(db);audit(session.role+' submitted '+f.title,c.id);toast('Form submitted. Thank you.');renderPortal()}
/* PDF ENGINE */
function pdfReady(){if(!window.jspdf?.jsPDF){toast('PDF library did not load. Check internet connection and try again.');return false}return true}
function pdfSettings(){const s=getDB().settings;return{practice:s.practiceName||"Dr. Barnet\'s Clinical Assessment Hub",psych:s.psychologistName||'Clinical Psychologist',cred:s.credentials||'',reg:s.registration||'',address:s.address||'',phone:s.phone||'',email:s.email||'',currency:s.currency||'JMD'}}
function addPdfHeader(doc,title,subtitle=''){const s=pdfSettings(),w=doc.internal.pageSize.getWidth();doc.setFillColor(10,53,109);doc.rect(0,0,w,38,'F');doc.setFillColor(241,194,50);doc.rect(0,38,w,3,'F');doc.setTextColor(255,255,255);doc.setFont('helvetica','bold');doc.setFontSize(16);doc.text(s.practice,16,16);doc.setFont('helvetica','normal');doc.setFontSize(8.5);const contact=[s.psych,s.cred,s.reg,s.phone,s.email].filter(Boolean).join('  |  ');if(contact)doc.text(contact,16,23,{maxWidth:w-32});doc.setFont('helvetica','bold');doc.setFontSize(12);doc.text(title,16,32);if(subtitle){doc.setFont('helvetica','normal');doc.setFontSize(8);doc.text(subtitle,w-16,32,{align:'right'})}doc.setTextColor(16,42,67)}
function pdfFooter(doc,confidential=true){const pages=doc.internal.getNumberOfPages(),s=pdfSettings();for(let i=1;i<=pages;i++){doc.setPage(i);const w=doc.internal.pageSize.getWidth(),h=doc.internal.pageSize.getHeight();doc.setDrawColor(215,226,239);doc.line(16,h-15,w-16,h-15);doc.setFont('helvetica','normal');doc.setFontSize(7);doc.setTextColor(105,122,139);doc.text(confidential?'CONFIDENTIAL - Clinical document':s.practice,16,h-9);doc.text(`Page ${i} of ${pages}`,w-16,h-9,{align:'right'})}}
function ensurePage(doc,y,need=28,title='PSYCHOLOGICAL REPORT'){const h=doc.internal.pageSize.getHeight();if(y+need>h-22){doc.addPage();addPdfHeader(doc,title);return 52}return y}
function addSection(doc,y,title,text){y=ensurePage(doc,y,26);doc.setFillColor(234,243,255);doc.roundedRect(16,y-4,doc.internal.pageSize.getWidth()-32,9,2,2,'F');doc.setFont('helvetica','bold');doc.setFontSize(10);doc.setTextColor(13,79,151);doc.text(title.toUpperCase(),20,y+2);y+=10;doc.setFont('times','normal');doc.setFontSize(10);doc.setTextColor(30,45,62);const lines=doc.splitTextToSize(text||'Information not available.',doc.internal.pageSize.getWidth()-36);for(const line of lines){y=ensurePage(doc,y,6);doc.text(line,18,y);y+=5}return y+5}
function drawScoreChart(doc,y,c){const t=c.results.filter(r=>r.verified&&r.t&&isFinite(Number(r.t)));if(!t.length)return y;y=ensurePage(doc,y,35+t.length*8);doc.setFont('helvetica','bold');doc.setFontSize(10);doc.setTextColor(13,79,151);doc.text('T-SCORE PROFILE',18,y);y+=7;const x0=66,x1=185,max=100;for(const r of t){const val=Math.max(0,Math.min(max,Number(r.t)));doc.setFont('helvetica','normal');doc.setFontSize(7.5);doc.setTextColor(45,61,79);doc.text((r.domain||r.instrument).slice(0,28),18,y+3);doc.setFillColor(230,237,246);doc.roundedRect(x0,y,x1-x0,5,2,2,'F');if(val>=65)doc.setFillColor(241,194,50);else doc.setFillColor(36,118,201);doc.roundedRect(x0,y,(x1-x0)*val/max,5,2,2,'F');doc.text(String(val),190,y+4,{align:'right'});y+=8}return y+5}
function downloadReportPDF(id){if(!pdfReady())return;const db=getDB(),c=db.cases.find(x=>x.id===id);if(!c)return;const {jsPDF}=window.jspdf,doc=new jsPDF({unit:'mm',format:'a4'}),d=reportDraft(c),saved=c.report.sections||{},child=answer(c,'parent','childName')||'Client';addPdfHeader(doc,'PSYCHOLOGICAL REPORT','CONFIDENTIAL');let y=52;doc.setFont('helvetica','bold');doc.setFontSize(17);doc.setTextColor(10,53,109);doc.text('Psychological Evaluation',105,y,{align:'center'});y+=8;doc.setFillColor(255,247,216);doc.roundedRect(16,y,178,10,2,2,'F');doc.setTextColor(122,91,0);doc.setFontSize(9);doc.text('CONFIDENTIAL - For authorized recipients only',105,y+6.5,{align:'center'});y+=17;doc.autoTable({startY:y,theme:'grid',styles:{fontSize:8,cellPadding:2.5,lineColor:[218,227,238],lineWidth:.2},headStyles:{fillColor:[13,79,151],textColor:255},columnStyles:{0:{fontStyle:'bold',fillColor:[242,247,253],cellWidth:45}},body:d['Client Information'].map(x=>[x[0],x[1]||'Not available']),margin:{left:16,right:16}});y=doc.lastAutoTable.finalY+9;for(const sec of RSECTIONS){const text=saved[sec]||d[sec]||'';y=addSection(doc,y,sec,text);if(sec==='Interpretations and Impressions'&&c.results.some(r=>r.verified)){y=ensurePage(doc,y,40);doc.autoTable({startY:y,head:[['Instrument','Domain','Raw','Std','T','%ile','CI','Age Eq.','Classification']],body:c.results.filter(r=>r.verified).map(r=>[r.instrument,r.domain,r.raw,r.standard,r.t,r.percentile,r.ci,r.ageEq,r.classification]),styles:{fontSize:6.8,cellPadding:1.8,lineColor:[218,227,238],lineWidth:.15},headStyles:{fillColor:[13,79,151],textColor:255},margin:{left:16,right:16}});y=doc.lastAutoTable.finalY+7;y=drawScoreChart(doc,y,c)}}pdfFooter(doc,true);doc.save(`${child.replace(/[^a-z0-9]+/gi,'_')}_${id}_Psychological_Report.pdf`);audit('Downloaded psychological report PDF',id)}
function downloadInvoicePDF(id,idx){if(!pdfReady())return;const db=getDB(),c=db.cases.find(x=>x.id===id),inv=c.invoices[idx],{jsPDF}=window.jspdf,doc=new jsPDF({unit:'mm',format:'a4'}),s=pdfSettings(),child=answer(c,'parent','childName')||'Client';addPdfHeader(doc,'INVOICE',inv.number);let y=53;doc.setFont('helvetica','bold');doc.setFontSize(22);doc.setTextColor(10,53,109);doc.text('INVOICE',16,y);doc.setFontSize(9);doc.setTextColor(97,117,138);doc.text(inv.number,194,y,{align:'right'});y+=13;doc.autoTable({startY:y,theme:'plain',styles:{fontSize:8.5,cellPadding:2},body:[['Billed To',inv.payer||'Not entered'],['Client',child],['Case ID',c.id],['Invoice Date',inv.date],['Due Date',inv.due||'—']],columnStyles:{0:{fontStyle:'bold',textColor:[13,79,151],cellWidth:35}},margin:{left:16,right:16}});y=doc.lastAutoTable.finalY+10;doc.autoTable({startY:y,head:[['Service','Fee','Discount','Total']],body:[[inv.service||'Psychological assessment',`${s.currency} $${Number(inv.fee).toLocaleString()}`,`${s.currency} $${Number(inv.discount).toLocaleString()}`,`${s.currency} $${Number(inv.total).toLocaleString()}`]],styles:{fontSize:9,cellPadding:3,lineColor:[218,227,238],lineWidth:.2},headStyles:{fillColor:[13,79,151],textColor:255},margin:{left:16,right:16}});y=doc.lastAutoTable.finalY+10;doc.setFillColor(255,247,216);doc.roundedRect(116,y,78,28,3,3,'F');doc.setFont('helvetica','normal');doc.setFontSize(8.5);doc.setTextColor(96,76,12);doc.text('Amount Paid',121,y+8);doc.text(`${s.currency} $${Number(inv.paid).toLocaleString()}`,189,y+8,{align:'right'});doc.setFont('helvetica','bold');doc.setFontSize(12);doc.text('BALANCE',121,y+19);doc.text(`${s.currency} $${(Number(inv.total)-Number(inv.paid)).toLocaleString()}`,189,y+19,{align:'right'});if(inv.notes){y+=38;doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setTextColor(13,79,151);doc.text('NOTES / PAYMENT TERMS',16,y);doc.setFont('times','normal');doc.setFontSize(9.5);doc.setTextColor(40,52,65);doc.text(doc.splitTextToSize(inv.notes,178),16,y+6)}pdfFooter(doc,false);doc.save(`${inv.number}_${child.replace(/[^a-z0-9]+/gi,'_')}.pdf`);audit('Downloaded invoice PDF',inv.number)}
function downloadReceiptPDF(id,idx){if(!pdfReady())return;const db=getDB(),c=db.cases.find(x=>x.id===id),r=c.receipts[idx],inv=c.invoices.find(i=>i.number===r.invoice),{jsPDF}=window.jspdf,doc=new jsPDF({unit:'mm',format:'a4'}),s=pdfSettings(),child=answer(c,'parent','childName')||'Client';addPdfHeader(doc,'OFFICIAL RECEIPT',r.number);let y=55;doc.setFillColor(231,246,241);doc.roundedRect(16,y,178,18,3,3,'F');doc.setFont('helvetica','bold');doc.setFontSize(19);doc.setTextColor(20,125,100);doc.text('PAYMENT RECEIVED',105,y+11,{align:'center'});y+=28;doc.autoTable({startY:y,theme:'grid',styles:{fontSize:9,cellPadding:3,lineColor:[218,227,238],lineWidth:.2},columnStyles:{0:{fontStyle:'bold',fillColor:[242,247,253],cellWidth:48}},body:[['Receipt Number',r.number],['Date',r.date],['Received From',r.payer||inv?.payer||'Not entered'],['For Client',child],['Case ID',c.id],['Invoice',r.invoice],['Payment Method',r.method],['Reference',r.reference||'—'],['Amount Received',`${s.currency} $${Number(r.amount).toLocaleString()}`],['Remaining Balance',inv?`${s.currency} $${(Number(inv.total)-Number(inv.paid)).toLocaleString()}`:'—']],margin:{left:16,right:16}});y=doc.lastAutoTable.finalY+16;doc.setFont('times','italic');doc.setFontSize(10);doc.setTextColor(87,103,119);doc.text('Thank you. This receipt confirms payment recorded for the service indicated above.',16,y);y+=18;doc.setDrawColor(105,122,139);doc.line(118,y,188,y);doc.setFont('helvetica','normal');doc.setFontSize(8);doc.text(s.psych||'Authorized clinician / representative',153,y+5,{align:'center'});pdfFooter(doc,false);doc.save(`${r.number}_${child.replace(/[^a-z0-9]+/gi,'_')}.pdf`);audit('Downloaded receipt PDF',r.number)}
